name: Build binaries

on:
  push:
    branches: [security-fixes]
  workflow_dispatch:

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build static binary (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o service-monitor-master-ubuntu.bin ./cmd/server
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: service-monitor-master-ubuntu
          path: service-monitor-master-ubuntu.bin

  build-centos:
    runs-on: ubuntu-latest
    container: centos:7
    steps:
      - uses: actions/checkout@v4
      - name: Install Go
        run: |
          curl -fsSL https://go.dev/dl/go1.25.5.linux-amd64.tar.gz -o /tmp/go.tgz
          tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
      - name: Build static binary (linux/amd64)
        run: |
          export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
          /usr/local/go/bin/go build -ldflags="-s -w" -o service-monitor-master-centos.bin ./cmd/server
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: service-monitor-master-centos
          path: service-monitor-master-centos.bin
