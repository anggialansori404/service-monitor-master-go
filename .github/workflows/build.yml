name: Build binaries

on:
  push:
    branches: [security-fixes]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build linux/amd64 (untuk Ubuntu & CentOS)
        run: |
          GOOS=linux GOARCH=amd64 go build -o monitoring-server-linux-amd64.bin cmd/server/main.go
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-server-linux-amd64
          path: monitoring-server-linux-amd64.bin
      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d message_thread_id="${{ secrets.TELEGRAM_TOPIC_ID }}" \
            -d text="🔨 Build master [$STATUS] — ${{ github.ref_name }} @ ${{ github.sha }}" \
            -d parse_mode="HTML"
