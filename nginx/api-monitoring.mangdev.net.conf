# service-monitor master — nginx reverse proxy
# Domain: api-monitoring.mangdev.net
#
# Taruh di mini PC: /etc/nginx/conf.d/api-monitoring.mangdev.net.conf
# Lalu: sudo nginx -t && sudo systemctl reload nginx
#       sudo certbot --nginx -d api-monitoring.mangdev.net

upstream svcmon_master {
    server 127.0.0.1:4001;
    keepalive 32;
}

server {
    listen 80;
    server_name api-monitoring.mangdev.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api-monitoring.mangdev.net;

    # Diisi otomatis oleh certbot --nginx.
    # Kalau manual:
    # ssl_certificate     /etc/letsencrypt/live/api-monitoring.mangdev.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api-monitoring.mangdev.net/privkey.pem;

    # --- Security headers (dipertahankan dari conf lama) ---
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Referrer-Policy;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none';" always;

    client_max_body_size 10m;

    # --- WebSocket agent (persistent) ---
    location /api/v1/ws/agent {
        proxy_pass http://svcmon_master;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- API + health ---
    location / {
        proxy_pass http://svcmon_master;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
