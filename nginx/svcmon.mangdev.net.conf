# service-monitor-master-go — nginx reverse proxy
#
# FILE BARU. Taruh di VPS: /etc/nginx/conf.d/svcmon.mangdev.net.conf
# JANGAN edit file .conf lain yang sudah ada.
#
# Langkah di VPS:
#   1. sudo cp svcmon.mangdev.net.conf /etc/nginx/conf.d/
#   2. sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d svcmon.mangdev.net   (isi SSL otomatis)
#
# Ganti svcmon.mangdev.net dengan domain pilihan akang bila beda.

upstream svcmon_master {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name svcmon.mangdev.net;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name svcmon.mangdev.net;

    # Diisi otomatis oleh certbot --nginx. Kalau manual:
    # ssl_certificate     /etc/letsencrypt/live/svcmon.mangdev.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/svcmon.mangdev.net/privkey.pem;

    client_max_body_size 10m;

    # --- WebSocket agent (persistent, jangan diputus nginx) ---
    location /api/v1/ws/agent {
        proxy_pass http://svcmon_master;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- API + health ---
    location / {
        proxy_pass http://svcmon_master;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
